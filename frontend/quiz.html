<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StudyMate AI — Interactive Quiz Generator</title>
  <link rel="stylesheet" href="design-system.css">

  <style>
    main {
      max-width: 900px;
      margin: 0 auto;
      padding: 2rem 1.5rem;
      position: relative;
      z-index: 1;
    }

    .quiz-config-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 1.75rem;
      margin-bottom: 2rem;
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1rem;
      margin-top: 1.25rem;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
    }

    .form-label {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    .select-input, .text-input {
      background: var(--bg-input);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 0.55rem 0.75rem;
      color: var(--text-main);
      font-family: var(--font-body);
      font-size: 0.82rem;
      transition: var(--transition);
    }

    .select-input:focus, .text-input:focus {
      outline: none;
      border-color: var(--border-hover);
      background: var(--bg-input-focus);
    }

    .question-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 1.75rem;
      margin-bottom: 1.25rem;
      display: none;
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
    }

    .question-card.active { display: block; }

    .q-num {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      margin-bottom: 0.35rem;
    }

    .q-text {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 1.25rem;
      color: #ffffff;
    }

    .option-list {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    .option-btn {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 0.75rem 1rem;
      color: var(--text-main);
      text-align: left;
      font-family: var(--font-body);
      font-size: 0.85rem;
      cursor: pointer;
      transition: var(--transition);
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .option-btn:hover {
      background: rgba(255, 255, 255, 0.06);
      border-color: var(--border-hover);
    }

    .option-btn.selected { background: #ffffff; color: #000000; border-color: #ffffff; font-weight: 700; }
    .option-btn.correct { background: var(--success); color: #ffffff; border-color: var(--success); }
    .option-btn.wrong { background: var(--danger); color: #ffffff; border-color: var(--danger); }

    .opt-key {
      width: 22px;
      height: 22px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.72rem;
      font-weight: 700;
    }

    .quiz-score-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 2.5rem 1.5rem;
      text-align: center;
      display: none;
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
    }

    .score-num {
      font-family: var(--font-heading);
      font-size: 3.2rem;
      font-weight: 800;
      color: #ffffff;
    }

    @media (max-width: 768px) {
      .form-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <div class="bg-grain"></div>
  <div class="bg-grid"></div>
  <div class="glow-orb orb-1"></div>
  <div class="glow-orb orb-2"></div>

  <header>
    <div class="nav-container">
      <a href="index.html" class="logo">
        <div class="logo-badge">AI</div>
        <span>StudyMate</span>
      </a>

      <button class="menu-toggle" id="menu-toggle" aria-label="Toggle menu">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>

      <nav id="navbar">
        <a href="index.html">Home</a>
        <a href="tutor.html">AI Tutor</a>
        <a href="notes.html">Notes</a>
        <a href="quiz.html" class="active">Quiz</a>
        <a href="flashcards.html">Flashcards</a>
        <a href="planner.html">Planner</a>
      </nav>
    </div>
  </header>

  <main>
    <div class="quiz-config-card">
      <h2 style="font-size: 1.35rem; color:#ffffff;">Generate Practice Quiz</h2>
      <p style="color:var(--text-muted); font-size:0.85rem; margin-top:0.2rem;">Test your recall with AI-generated multiple choice questions.</p>

      <div class="form-grid">
        <div class="form-group">
          <label class="form-label" for="quiz-topic">Quiz Topic</label>
          <input type="text" id="quiz-topic" class="text-input" placeholder="e.g. Physics, Cell Biology...">
        </div>

        <div class="form-group">
          <label class="form-label" for="quiz-count">Question Count</label>
          <select id="quiz-count" class="select-input">
            <option value="3">3 Questions</option>
            <option value="5">5 Questions</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label" for="quiz-difficulty">Difficulty</label>
          <select id="quiz-difficulty" class="select-input">
            <option value="easy">Easy / Intro</option>
            <option value="medium">Medium</option>
            <option value="hard">Advanced</option>
          </select>
        </div>
      </div>

      <button class="btn btn-primary" id="start-quiz-btn" style="margin-top:1.25rem;">
        <span>Start Quiz</span>
      </button>
    </div>

    <div class="question-card" id="question-card">
      <div class="q-num" id="q-num">Question 1 of 3</div>
      <div class="q-text" id="q-text">What is the primary function of mitochondria in eukaryotic cells?</div>

      <div class="option-list" id="option-list"></div>

      <button class="btn btn-primary" id="next-q-btn" style="margin-top:1.5rem; display:none;">
        <span>Next Question</span>
      </button>
    </div>

    <div class="quiz-score-card" id="score-card">
      <h3 style="font-size:1rem; color:var(--text-muted);">Quiz Completed!</h3>
      <div class="score-num" id="final-score">80%</div>
      <p style="color:var(--text-muted); margin-bottom:1.25rem; font-size:0.85rem;" id="score-text">You answered 4 out of 5 questions correctly.</p>
      <button class="btn btn-secondary" id="restart-quiz-btn">Take Another Quiz</button>
    </div>
  </main>

  <script type="module">
    import { getSession, saveQuizScore, loadQuizHistory, callAI } from './db.js'

    const menuToggle = document.getElementById('menu-toggle');
    const navbar = document.getElementById('navbar');
    menuToggle.addEventListener('click', () => navbar.classList.toggle('mobile-active'));

    const startBtn    = document.getElementById('start-quiz-btn');
    const topicInput  = document.getElementById('quiz-topic');
    const countSelect = document.getElementById('quiz-count');
    const diffSelect  = document.getElementById('quiz-difficulty');
    const questionCard = document.getElementById('question-card');
    const scoreCard   = document.getElementById('score-card');
    const qNum        = document.getElementById('q-num');
    const qText       = document.getElementById('q-text');
    const optionList  = document.getElementById('option-list');
    const nextBtn     = document.getElementById('next-q-btn');
    const restartBtn  = document.getElementById('restart-quiz-btn');
    const finalScore  = document.getElementById('final-score');
    const scoreText   = document.getElementById('score-text');

    let currentQuestions = [], currentIndex = 0, correctCount = 0;
    let currentUserId = null;

    const mockDatabase = [
      { question: 'What is the powerhouse organelle responsible for ATP production?', options: ['Ribosome', 'Mitochondria', 'Golgi Apparatus', 'Endoplasmic Reticulum'], correct: 1 },
      { question: 'Which law states that energy cannot be created or destroyed?', options: ['First Law of Thermodynamics', 'Second Law of Thermodynamics', "Newton's Third Law", "Ohm's Law"], correct: 0 },
      { question: 'What is the chemical symbol for Gold on the periodic table?', options: ['Ag', 'Fe', 'Au', 'Pb'], correct: 2 },
      { question: 'What does CPU stand for?', options: ['Central Processing Unit', 'Computer Processing Utility', 'Control Processing Unit', 'Core Power Unit'], correct: 0 },
      { question: 'Which planet is closest to the Sun?', options: ['Venus', 'Earth', 'Mars', 'Mercury'], correct: 3 },
    ];

    startBtn.addEventListener('click', async () => {
      const count  = parseInt(countSelect.value);
      const topic  = topicInput.value.trim() || 'General Knowledge';
      const diff   = diffSelect.value;

      startBtn.disabled = true;
      startBtn.textContent = 'Generating Quiz...';

      try {
        const { questions } = await callAI('quiz', { topic, count, difficulty: diff });
        currentQuestions = questions;
      } catch (err) {
        console.error('[Quiz] AI error:', err);
        // Fallback to built-in questions
        currentQuestions = [
          { question: 'What is the powerhouse organelle responsible for ATP production?', options: ['Ribosome', 'Mitochondria', 'Golgi Apparatus', 'Endoplasmic Reticulum'], correct: 1 },
          { question: 'Which law states that energy cannot be created or destroyed?', options: ['First Law of Thermodynamics', 'Second Law of Thermodynamics', "Newton's Third Law", "Ohm's Law"], correct: 0 },
          { question: 'What is the chemical symbol for Gold on the periodic table?', options: ['Ag', 'Fe', 'Au', 'Pb'], correct: 2 },
        ].slice(0, count);
      }

      startBtn.disabled = false;
      startBtn.textContent = 'Start Quiz';
      currentIndex = 0;
      correctCount = 0;
      scoreCard.style.display = 'none';
      questionCard.classList.add('active');
      renderQuestion();
    });

    function renderQuestion() {
      const q = currentQuestions[currentIndex];
      qNum.innerText = `Question ${currentIndex + 1} of ${currentQuestions.length}`;
      qText.innerText = q.question;
      optionList.innerHTML = '';
      nextBtn.style.display = 'none';
      q.options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerHTML = `<span class="opt-key">${String.fromCharCode(65 + idx)}</span> <span>${opt}</span>`;
        btn.addEventListener('click', () => {
          if (btn.dataset.answered) return;
          btn.dataset.answered = '1';
          optionList.querySelectorAll('.option-btn').forEach(b => b.dataset.answered = '1');
          if (idx === q.correct) { btn.classList.add('correct'); correctCount++; }
          else {
            btn.classList.add('wrong');
            optionList.querySelectorAll('.option-btn')[q.correct]?.classList.add('correct');
          }
          nextBtn.style.display = 'inline-flex';
        });
        optionList.appendChild(btn);
      });
    }

    nextBtn.addEventListener('click', () => {
      currentIndex++;
      if (currentIndex < currentQuestions.length) {
        renderQuestion();
      } else {
        questionCard.classList.remove('active');
        scoreCard.style.display = 'block';
        const pct = Math.round((correctCount / currentQuestions.length) * 100);
        finalScore.innerText = `${pct}%`;
        scoreText.innerText = `You answered ${correctCount} out of ${currentQuestions.length} correctly.`;

        // Save to Supabase if logged in
        if (currentUserId) {
          saveQuizScore(currentUserId, {
            topic:      topicInput.value.trim() || 'General',
            difficulty: diffSelect.value,
            scorePct:   pct,
            correct:    correctCount,
            total:      currentQuestions.length,
          }).then(() => loadAndRenderHistory());
        }
      }
    });

    restartBtn.addEventListener('click', () => scoreCard.style.display = 'none');

    // ── Score history ──────────────────────────────────────────────────────────
    async function loadAndRenderHistory() {
      if (!currentUserId) return;
      const history = await loadQuizHistory(currentUserId);
      let histEl = document.getElementById('quiz-history');
      if (!histEl) {
        histEl = document.createElement('div');
        histEl.id = 'quiz-history';
        histEl.style.cssText = 'margin-top:1.5rem; padding-top:1.25rem; border-top:1px solid var(--border-subtle);';
        scoreCard.appendChild(histEl);
      }
      if (!history.length) { histEl.innerHTML = ''; return; }
      histEl.innerHTML = `
        <p style="font-size:0.75rem; color:var(--text-muted); margin-bottom:0.75rem; font-weight:600; text-transform:uppercase; letter-spacing:0.07em;">Recent Scores</p>
        ${history.map(h => `
          <div style="display:flex; justify-content:space-between; align-items:center; padding:0.4rem 0; border-bottom:1px solid rgba(255,255,255,0.04); font-size:0.78rem;">
            <span style="color:var(--text-muted);">${h.topic} &middot; ${h.difficulty}</span>
            <span style="font-weight:700; color:${h.score_pct >= 70 ? '#10b981' : h.score_pct >= 40 ? '#f59e0b' : '#ef4444'}">${h.score_pct}%</span>
          </div>`).join('')}
      `;
    }

    // ── Bootstrap ──────────────────────────────────────────────────────────────
    ;(async () => {
      const session = await getSession();
      if (session) currentUserId = session.user.id;
    })();
  </script>
  <script type="module" src="auth-guard.js"></script>
  <script type="module" src="auth-helper.js"></script>
</body>
</html>
