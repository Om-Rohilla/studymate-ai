<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StudyMate AI — 3D Active Recall Flashcards</title>
  <link rel="stylesheet" href="design-system.css">

  <style>
    main {
      max-width: 800px;
      margin: 0 auto;
      padding: 3rem 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      z-index: 1;
    }

    .card-scene {
      width: 100%;
      max-width: 520px;
      height: 300px;
      perspective: 1000px;
      margin-bottom: 2rem;
      cursor: pointer;
    }

    .card-object {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .card-object.flipped {
      transform: rotateY(180deg);
    }

    .card-face {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 2.5rem 2rem;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
    }

    .card-face.back {
      transform: rotateY(180deg);
      border-color: var(--border-hover);
    }

    .card-badge {
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 1rem;
    }

    .card-text {
      font-size: 1.25rem;
      font-weight: 700;
      color: #ffffff;
      line-height: 1.4;
    }

    .nav-controls {
      display: flex;
      align-items: center;
      gap: 1.25rem;
    }

    .counter-pill {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      padding: 0.4rem 1rem;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-full);
    }
  </style>
</head>
<body>

  <div class="bg-grid"></div>
  <div class="glow-orb orb-1"></div>
  <div class="glow-orb orb-2"></div>

  <header>
    <div class="nav-container">
      <a href="index.html" class="logo">
        <div class="logo-badge">AI</div>
        <span>StudyMate</span>
      </a>

      <button class="menu-toggle" id="menu-toggle" aria-label="Toggle menu">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>

      <nav id="navbar">
        <a href="index.html">Home</a>
        <a href="tutor.html">AI Tutor</a>
        <a href="notes.html">Notes</a>
        <a href="quiz.html">Quiz</a>
        <a href="flashcards.html" class="active">Flashcards</a>
        <a href="planner.html">Planner</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
      </nav>
    </div>
  </header>

  <main>
    <div style="text-align:center; margin-bottom:2rem;">
      <h1 style="font-size: 1.8rem; margin-bottom:0.3rem;">Interactive Flashcards</h1>
      <p style="font-size:0.85rem;">Click the card to flip between question and answer.</p>
    </div>

    <div class="card-scene" id="card-scene">
      <div class="card-object" id="card-object">
        <div class="card-face front">
          <div class="card-badge">FRONT — QUESTION</div>
          <div class="card-text" id="front-text">What is the Big O time complexity of Binary Search?</div>
        </div>
        <div class="card-face back">
          <div class="card-badge">BACK — ANSWER</div>
          <div class="card-text" id="back-text">O(log n) time complexity.</div>
        </div>
      </div>
    </div>

    <div class="nav-controls">
      <button class="btn btn-secondary" id="prev-btn">← Previous</button>
      <div class="counter-pill" id="card-counter">1 / 3</div>
      <button class="btn btn-primary" id="next-btn">Next →</button>
    </div>
  </main>

  <script type="module">
    import { getSession, saveFlashcardDeck, loadFlashcardDeck, callAI } from './db.js'

    const menuToggle = document.getElementById('menu-toggle');
    const navbar = document.getElementById('navbar');
    menuToggle.addEventListener('click', () => navbar.classList.toggle('mobile-active'));

    const cardScene   = document.getElementById('card-scene');
    const cardObject  = document.getElementById('card-object');
    const frontText   = document.getElementById('front-text');
    const backText    = document.getElementById('back-text');
    const counterEl   = document.getElementById('card-counter');
    const prevBtn     = document.getElementById('prev-btn');
    const nextBtn     = document.getElementById('next-btn');

    // Add a topic input + generate button above the card
    const main = document.querySelector('main');
    const topicBar = document.createElement('div');
    topicBar.style.cssText = 'display:flex; gap:0.6rem; margin-bottom:1.5rem; width:100%; max-width:520px;';
    topicBar.innerHTML = `
      <input id="fc-topic" type="text" placeholder="Topic (e.g. Photosynthesis, Calculus, Python)..."
        style="flex:1; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.12);
               border-radius:10px; padding:0.55rem 0.85rem; color:#ffffff; font-size:0.82rem;
               font-family:var(--font-body); outline:none; transition:border-color 0.2s ease;"
        onfocus="this.style.borderColor='rgba(255,255,255,0.3)'" onblur="this.style.borderColor='rgba(255,255,255,0.12)'">
      <button id="fc-gen-btn"
        style="background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.14); border-radius:10px;
               padding:0.55rem 1rem; color:#ffffff; font-size:0.8rem; font-weight:600;
               cursor:pointer; white-space:nowrap; transition:all 0.2s ease;"
        onmouseover="this.style.background='rgba(255,255,255,0.14)'" onmouseout="this.style.background='rgba(255,255,255,0.08)'">
        ✦ Generate Cards
      </button>`;
    main.insertBefore(topicBar, main.children[1]);

    let cards = [
      { front: 'What is the Big O time complexity of Binary Search?', back: 'O(log n) time complexity.' },
      { front: 'What process converts DNA sequences into mRNA molecules?', back: 'Transcription (RNA Polymerase enzyme).' },
      { front: "What is Euler's Formula linking exponential and trigonometric functions?", back: 'e^(i * theta) = cos(theta) + i * sin(theta)' },
    ];

    let currentCardIndex = 0;
    let currentUserId = null;

    function renderCard() {
      cardObject.classList.remove('flipped');
      setTimeout(() => {
        frontText.innerText = cards[currentCardIndex].front;
        backText.innerText  = cards[currentCardIndex].back;
        counterEl.innerText = `${currentCardIndex + 1} / ${cards.length}`;
      }, 150);
    }

    cardScene.addEventListener('click', () => cardObject.classList.toggle('flipped'));
    prevBtn.addEventListener('click', () => {
      if (currentCardIndex > 0) { currentCardIndex--; renderCard(); }
    });
    nextBtn.addEventListener('click', () => {
      if (currentCardIndex < cards.length - 1) { currentCardIndex++; renderCard(); }
    });

    // Generate AI flashcards
    document.getElementById('fc-gen-btn').addEventListener('click', async () => {
      const topic = document.getElementById('fc-topic').value.trim();
      if (!topic) return;
      const btn = document.getElementById('fc-gen-btn');
      btn.textContent = 'Generating...';
      btn.disabled = true;
      try {
        const { cards: aiCards } = await callAI('flashcards', { topic, count: 8 });
        cards = aiCards;
        currentCardIndex = 0;
        renderCard();
        if (currentUserId) await saveFlashcardDeck(currentUserId, { name: topic, cards });
      } catch (err) {
        console.error('[Flashcards] AI error:', err);
      }
      btn.textContent = '✦ Generate Cards';
      btn.disabled = false;
    });

    // Bootstrap: load saved deck from Supabase
    ;(async () => {
      const session = await getSession();
      if (session) {
        currentUserId = session.user.id;
        const deck = await loadFlashcardDeck(currentUserId);
        if (deck?.cards?.length > 0) {
          cards = deck.cards;
          currentCardIndex = 0;
          renderCard();
        }
      }
    })();
  </script>
  <script type="module" src="auth-guard.js"></script>
  <script type="module" src="auth-helper.js"></script>
</body>
</html>
